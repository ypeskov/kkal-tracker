apiVersion: batch/v1
kind: CronJob
metadata:
  name: kkal-tracker-backup
spec:
  # Schedule in local timezone
  # Now you can set time directly without UTC conversion
  schedule: "0 2 * * *"  # 2:00 AM Sofia time
  timeZone: "Europe/Sofia"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  concurrencyPolicy: Forbid  # Prevent concurrent runs
  jobTemplate:
    spec:
      backoffLimit: 3  # Retry up to 3 times on failure
      template:
        spec:
          restartPolicy: OnFailure
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: kkal-tracker-pvc
            - name: backup-script
              configMap:
                name: backup-script
                defaultMode: 0755
          containers:
            - name: backup
              # Built from kubernetes/backup/Dockerfile (pinned rclone + sqlite3)
              image: ypeskov/kkal-tracker-backup:1.75.1
              command: ["/bin/sh", "/scripts/backup.sh"]
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: backup-script
                  mountPath: /scripts
              # Only the settings the backup script needs, not the whole application environment
              env:
                - name: GDRIVE_OAUTH_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: kkal-tracker-secrets
                      key: GDRIVE_OAUTH_TOKEN
                      optional: true
                - name: GDRIVE_FOLDER_PATH
                  valueFrom:
                    configMapKeyRef:
                      name: kkal-tracker-env
                      key: GDRIVE_FOLDER_PATH
                      optional: true
                - name: GDRIVE_CLEANUP
                  valueFrom:
                    configMapKeyRef:
                      name: kkal-tracker-env
                      key: GDRIVE_CLEANUP
                      optional: true
                - name: DATABASE_PATH
                  value: "/data/app.db"
                - name: BACKUP_PATH
                  value: "/data/backups"
                - name: RETENTION_DAYS
                  value: "7"  # Keep backups for 7 days locally
              resources:
                limits:
                  memory: "256Mi"
                  cpu: "200m"
                requests:
                  memory: "128Mi"
                  cpu: "100m"