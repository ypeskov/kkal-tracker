root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  args_bin = []
  bin = "main"
  cmd = "make build"
  delay = 1000
  exclude_dir = ["tmp", "vendor", "testdata", "web/node_modules", "web/dist", "bin", "data"]
  exclude_file = ["web/package-lock.json"]
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  include_dir = []
  include_ext = ["go", "tsx", "ts", "html", "css", "js", "json"]
  # Skill files embedded into the binary (skills/embed.go); md/py are not in include_ext to skip doc edits
  include_file = ["skills/kkal-tracker-food-log/SKILL.md", "skills/kkal-tracker-food-log/scripts/kkal_client.py"]
  kill_delay = "0s"
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  post_cmd = []
  pre_cmd = []
  rerun = false
  rerun_delay = 500
  send_interrupt = false
  stop_on_error = false

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  silent = false
  time = false

[misc]
  clean_on_exit = false

[proxy]
  app_port = 0
  enabled = false
  proxy_port = 0

[screen]
  clear_on_rebuild = false
  keep_scroll = true